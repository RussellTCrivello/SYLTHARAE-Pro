# The locked environment for the Round 22 verification runs.
#
# `pip freeze` of the virtualenv that produced the runs in
# audit_report/r22_workbook/junit/. Rebuild with:
#
#     python3.11 -m venv /tmp/rv
#     /tmp/rv/bin/pip install -r requirements.txt   # unpinned, resolves today
#     /tmp/rv/bin/pip install pytest pgserver
#     /tmp/rv/bin/pip install -r requirements.lock  # then pin exactly this set
#
# or, on a fresh interpreter, `pip install -r requirements.lock` alone.
#
# python: 3.11.2
# packages: 118
# set hash: 1353dba7e052f925f0ae967601c24eae17a398a7335228ed0231d82adabf6814
#
# The hash is over the sorted `name==version` lines, without this header, so it
# can be recomputed from an installed environment by `tools/audit/env_lock.py`.
# A run whose installed set hashes to something else is not reproducible and the
# classifier refuses to label it; pass --environment-label to say so out loud.
#
# NOT captured by this file, and equally able to change a result (see
# audit_report/r22_workbook/ENVIRONMENT.md):
#   * the native libraries OpenCV needs (libGL.so.1 is absent here, so `import
#     cv2` fails even though opencv 5.0.0.93 is installed)
#   * the `tesseract` binary (absent: pytesseract is installed and unusable)
#   * an `ffmpeg` binary (absent: the media reader reports the dependency)
#   * the PostgreSQL build that `pgserver` unpacks
