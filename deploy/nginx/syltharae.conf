# SYLTHARAE - the public TLS front door.
#
# The application serves plain HTTP on 127.0.0.1:5000 and is never exposed
# directly: everything a browser touches arrives through this site. It
# terminates TLS, replaces the forwarded headers instead of appending to them,
# and lets the long-running streaming endpoints through unbuffered.
#
# Deploy:
#   1. put the certificate and key at the paths in the `server` block below
#      (or edit them; that is the only file-specific part of this site);
#   2. set `server_name` to the public name;
#   3. copy this file to /etc/nginx/conf.d/syltharae.conf (or sites-available)
#      and run `nginx -t` before reloading.
#
# The application must run with TRUSTED_PROXY_COUNT=1 and FLASK_HOST=127.0.0.1
# so ProxyFix trusts exactly this one hop - see apps/web/deployment.py, which
# warns when those two settings disagree with each other.

# The single backend. `keepalive` keeps upstream connections open between
# requests; the application is one hardened process (deploy/systemd/...).
upstream syltharae_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Plain HTTP exists only to send the browser to HTTPS. HSTS is the
# application's decision (it is only sent when the request arrived over TLS
# and FLASK_ENV=production), so no copy is added here: in both places a browser
# sees two headers it must combine, and here alone the application's own
# production check has nothing to act on. Add "# them here too" only if you
# also remove the application's header.
server {
    listen 80;
    listen [::]:80;
    server_name syltharae.example.org;

    # nginx's own version is not advertised.
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name syltharae.example.org;

    server_tokens off;

    # Certificates: replace these two paths with the deployment's own.
    ssl_certificate     /etc/ssl/certs/syltharae.pem;
    ssl_certificate_key /etc/ssl/private/syltharae.key;

    # TLS 1.0/1.1 are refused outright; tools/smoke/live_smoke.py checks this
    # from the outside with a TLS 1.1 handshake that must fail.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SYLTHARAE_TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Ingestion posts whole binaries, and the operations endpoints stream job
    # progress back. The application's own ceiling is OPERATIONS_MAX_UPLOAD_MB
    # (2048 MB by default); this must not be the smaller of the two.
    client_max_body_size 2g;
    client_body_timeout 600s;

    # A large import can run for minutes before it answers.
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # DEPLOY-H2-GOAWAY: browsers hold one HTTP/2 connection per origin. At
    # nginx's default (1000) the connection was closed after roughly twenty
    # page views and the scripts requested on it failed with net::ERR_FAILED,
    # leaving pages whose handlers were never defined. Keep the connection
    # alive for far longer than a session's request count and bound its
    # lifetime by time instead.
    keepalive_requests 100000;
    keepalive_time 1h;

    # The forwarded headers are *replaced*, never appended. $proxy_add_x_-
    # forwarded_for would keep a client-supplied address in front of the real
    # one, which is the value the app records in the audit log and uses for
    # rate limiting.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Flask-WTF compares the Referer with the request's own origin: without
    # these two, every sign-in behind the proxy answers 400 (see
    # tests/security/test_proxy_deployment.py).
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Nothing about a page is cacheable: it carries a session, and the API
    # answers are per-user. The application already sends no-store; this keeps
    # a proxy from inventing a cache.
    proxy_buffering off;
    proxy_request_buffering on;

    # The streaming endpoints announce themselves with X-Accel-Buffering: no;
    # this is the belt to that braces - long-lived event streams must not sit
    # in a proxy buffer.
    location ~ ^/(api/(operations|cursor)/.*/stream|operations/.*/progress)$ {
        proxy_pass http://syltharae_app;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://syltharae_app;
    }
}
